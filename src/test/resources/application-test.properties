server.port=0

internal.api-key=test-internal-key

services.auth.url=${AUTH_SERVICE_URL}
services.user.url=${USER_SERVICE_URL}
services.order.url=${ORDER_SERVICE_URL}

spring.cloud.gateway.server.webflux.routes[0].id=auth-service-internal
spring.cloud.gateway.server.webflux.routes[0].uri=${services.auth.url}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/internal/auth/**
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=InternalApiKeyFilter

spring.cloud.gateway.server.webflux.routes[1].id=auth-service
spring.cloud.gateway.server.webflux.routes[1].uri=${services.auth.url}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[2].id=user-service-internal
spring.cloud.gateway.server.webflux.routes[2].uri=${services.user.url}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/internal/users/**
spring.cloud.gateway.server.webflux.routes[2].filters[0].name=InternalApiKeyFilter

spring.cloud.gateway.server.webflux.routes[3].id=user-service
spring.cloud.gateway.server.webflux.routes[3].uri=${services.user.url}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/users/**

spring.cloud.gateway.server.webflux.routes[4].id=order-service-orders
spring.cloud.gateway.server.webflux.routes[4].uri=${services.order.url}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.server.webflux.routes[5].id=order-service-items
spring.cloud.gateway.server.webflux.routes[5].uri=${services.order.url}
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/items/**

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui

springdoc.swagger-ui.urls[0].name=API Gateway
springdoc.swagger-ui.urls[0].url=/api-docs

springdoc.swagger-ui.urls[1].name=Auth Service
springdoc.swagger-ui.urls[1].url=/auth-service/api-docs

springdoc.swagger-ui.urls[2].name=User Service
springdoc.swagger-ui.urls[2].url=/user-service/api-docs

springdoc.swagger-ui.urls[3].name=Order Service
springdoc.swagger-ui.urls[3].url=/order-service/api-docs

wiremock.server.port=0