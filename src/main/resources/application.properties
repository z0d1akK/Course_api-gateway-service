spring.application.name=api-gateway

spring.config.import=optional:file:.env[.properties]

spring.profiles.active=${ACTIVE_PROFILE}

server.port=${SERVER_PORT}

internal.api-key=${INTERNAL_API_KEY}

spring.cloud.gateway.server.webflux.routes[0].id=auth-api-docs
spring.cloud.gateway.server.webflux.routes[0].uri=${services.auth.url}
spring.cloud.gateway.server.webflux.routes[0].predicates=Path=/auth-service/api-docs
spring.cloud.gateway.server.webflux.routes[0].filters=SetPath=/api-docs

spring.cloud.gateway.server.webflux.routes[1].id=user-api-docs
spring.cloud.gateway.server.webflux.routes[1].uri=${services.user.url}
spring.cloud.gateway.server.webflux.routes[1].predicates=Path=/user-service/api-docs
spring.cloud.gateway.server.webflux.routes[1].filters=SetPath=/api-docs

spring.cloud.gateway.server.webflux.routes[2].id=order-api-docs
spring.cloud.gateway.server.webflux.routes[2].uri=${services.order.url}
spring.cloud.gateway.server.webflux.routes[2].predicates=Path=/order-service/api-docs
spring.cloud.gateway.server.webflux.routes[2].filters=SetPath=/api-docs

spring.cloud.gateway.server.webflux.routes[3].id=payment-api-docs
spring.cloud.gateway.server.webflux.routes[3].uri=${services.payment.url}
spring.cloud.gateway.server.webflux.routes[3].predicates=Path=/payment-service/api-docs
spring.cloud.gateway.server.webflux.routes[3].filters=SetPath=/api-docs

spring.cloud.gateway.server.webflux.routes[4].id=auth-service-internal
spring.cloud.gateway.server.webflux.routes[4].uri=${services.auth.url}
spring.cloud.gateway.server.webflux.routes[4].predicates=Path=/internal/auth/**
spring.cloud.gateway.server.webflux.routes[4].filters[0].name=InternalApiKeyFilter

spring.cloud.gateway.server.webflux.routes[5].id=auth-service
spring.cloud.gateway.server.webflux.routes[5].uri=${services.auth.url}
spring.cloud.gateway.server.webflux.routes[5].predicates=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[6].id=user-service-internal
spring.cloud.gateway.server.webflux.routes[6].uri=${services.user.url}
spring.cloud.gateway.server.webflux.routes[6].predicates=Path=/internal/users/**
spring.cloud.gateway.server.webflux.routes[6].filters[0].name=InternalApiKeyFilter

spring.cloud.gateway.server.webflux.routes[7].id=user-service-users-root
spring.cloud.gateway.server.webflux.routes[7].uri=${services.user.url}
spring.cloud.gateway.server.webflux.routes[7].predicates=Path=/api/users

spring.cloud.gateway.server.webflux.routes[8].id=user-service-users
spring.cloud.gateway.server.webflux.routes[8].uri=${services.user.url}
spring.cloud.gateway.server.webflux.routes[8].predicates=Path=/api/users/**

spring.cloud.gateway.server.webflux.routes[9].id=user-service-payment-cards-root
spring.cloud.gateway.server.webflux.routes[9].uri=${services.user.url}
spring.cloud.gateway.server.webflux.routes[9].predicates=Path=/api/payment-cards

spring.cloud.gateway.server.webflux.routes[10].id=user-service-payment-cards
spring.cloud.gateway.server.webflux.routes[10].uri=${services.user.url}
spring.cloud.gateway.server.webflux.routes[10].predicates=Path=/api/payment-cards/**

spring.cloud.gateway.server.webflux.routes[11].id=order-service-root
spring.cloud.gateway.server.webflux.routes[11].uri=${services.order.url}
spring.cloud.gateway.server.webflux.routes[11].predicates=Path=/api/orders

spring.cloud.gateway.server.webflux.routes[12].id=order-service-orders
spring.cloud.gateway.server.webflux.routes[12].uri=${services.order.url}
spring.cloud.gateway.server.webflux.routes[12].predicates=Path=/api/orders/**

spring.cloud.gateway.server.webflux.routes[13].id=order-service-items-root
spring.cloud.gateway.server.webflux.routes[13].uri=${services.order.url}
spring.cloud.gateway.server.webflux.routes[13].predicates=Path=/api/items

spring.cloud.gateway.server.webflux.routes[14].id=order-service-items
spring.cloud.gateway.server.webflux.routes[14].uri=${services.order.url}
spring.cloud.gateway.server.webflux.routes[14].predicates=Path=/api/items/**

spring.cloud.gateway.server.webflux.routes[15].id=payment-service-summary
spring.cloud.gateway.server.webflux.routes[15].uri=${services.payment.url}
spring.cloud.gateway.server.webflux.routes[15].predicates=Path=/api/payments/users/*/summary

spring.cloud.gateway.server.webflux.routes[16].id=payment-service-payments-root
spring.cloud.gateway.server.webflux.routes[16].uri=${services.payment.url}
spring.cloud.gateway.server.webflux.routes[16].predicates=Path=/api/payments

spring.cloud.gateway.server.webflux.routes[17].id=payment-service-payments
spring.cloud.gateway.server.webflux.routes[17].uri=${services.payment.url}
spring.cloud.gateway.server.webflux.routes[17].predicates=Path=/api/payments/**

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui

springdoc.swagger-ui.urls[0].name=API Gateway
springdoc.swagger-ui.urls[0].url=/api-docs

springdoc.swagger-ui.urls[1].name=Auth Service
springdoc.swagger-ui.urls[1].url=/auth-service/api-docs

springdoc.swagger-ui.urls[2].name=User Service
springdoc.swagger-ui.urls[2].url=/user-service/api-docs

springdoc.swagger-ui.urls[3].name=Order Service
springdoc.swagger-ui.urls[3].url=/order-service/api-docs

springdoc.swagger-ui.urls[4].name=Payment Service
springdoc.swagger-ui.urls[4].url=/payment-service/api-docs

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=@project.version@
info.app.java=${java.version}