services:

  api-gateway:
    image: api-gateway:1.0
    build:
      context: .
      dockerfile: Dockerfile

    container_name: api-gateway

    restart: unless-stopped

    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"

    environment:
      SPRING_PROFILES_ACTIVE: ${ACTIVE_PROFILE}
      SERVER_PORT: ${SERVER_PORT}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      AUTH_SERVICE_DOCKER_URL: ${AUTH_SERVICE_DOCKER_URL}
      USER_SERVICE_DOCKER_URL: ${USER_SERVICE_DOCKER_URL}
      ORDER_SERVICE_DOCKER_URL: ${ORDER_SERVICE_DOCKER_URL}

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${SERVER_PORT}/api-docs || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    networks:
      - user-service-network
      - auth-service-network
      - order-service-network

networks:
  user-service-network:
    external: true
    name: user-service-network
  auth-service-network:
    external: true
    name: auth-service-network
  order-service-network:
    external: true
    name: order-service-network