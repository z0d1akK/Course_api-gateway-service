services:

  api-gateway:
    image: api-gateway:1.0
    build:
      context: .
      dockerfile: Dockerfile

    container_name: api-gateway

    restart: unless-stopped

    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"

    environment:
      SPRING_PROFILES_ACTIVE: ${ACTIVE_PROFILE}
      SERVER_PORT: ${SERVER_PORT}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY}
      AUTH_SERVICE_HOST: ${AUTH_SERVICE_HOST}
      AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT}
      USER_SERVICE_HOST: ${USER_SERVICE_HOST}
      USER_SERVICE_PORT: ${USER_SERVICE_PORT}
      ORDER_SERVICE_HOST: ${ORDER_SERVICE_HOST}
      ORDER_SERVICE_PORT: ${ORDER_SERVICE_PORT}
      PAYMENT_SERVICE_HOST: ${PAYMENT_SERVICE_HOST}
      PAYMENT_SERVICE_PORT: ${PAYMENT_SERVICE_PORT}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

    depends_on:
      kafka:
        condition: service_healthy

    networks:
      - user-service-network
      - auth-service-network
      - order-service-network
      - payment-service-network
      - kafka-network

  auth-service:
    image: auth-service:1.0
    build:
      context: ../auth-service
      dockerfile: Dockerfile

    container_name: auth-service

    restart: unless-stopped

    ports:
      - "${AUTH_SERVICE_PORT}:${AUTH_SERVICE_PORT}"

    environment:
      SPRING_PROFILES_ACTIVE: ${ACTIVE_PROFILE}
      SERVER_PORT: ${AUTH_SERVICE_PORT}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${AUTH_POSTGRES_HOST}:${AUTH_POSTGRES_PORT}/${AUTH_POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${AUTH_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY}
      CORS_ALLOWED_ORIGINS: ${AUTH_SERVICE_CORS_ALLOWED_ORIGINS}

    depends_on:
      auth-postgres:
        condition: service_healthy

    networks:
      - auth-service-network

  auth-postgres:
    image: postgres:17
    container_name: auth-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${AUTH_POSTGRES_DB}
      POSTGRES_USER: ${AUTH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}

    ports:
      - "${AUTH_POSTGRES_HOST_PORT}:${AUTH_POSTGRES_PORT}"

    command: -p ${AUTH_POSTGRES_PORT}

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${AUTH_POSTGRES_USER} -p ${AUTH_POSTGRES_PORT}" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    volumes:
      - auth-postgres-data:/var/lib/postgresql/data

    networks:
      - auth-service-network

  user-service:
    image: user-service:1.0
    build:
      context: ../user-service
      dockerfile: Dockerfile

    container_name: user-service

    restart: unless-stopped

    ports:
      - "${USER_SERVICE_PORT}:${USER_SERVICE_PORT}"

    environment:
      SPRING_PROFILES_ACTIVE: ${ACTIVE_PROFILE}
      SERVER_PORT: ${USER_SERVICE_PORT}
      POSTGRES_DB: ${USER_POSTGRES_DB}
      POSTGRES_USER: ${USER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${USER_POSTGRES_PASSWORD}
      POSTGRES_PORT: ${USER_POSTGRES_PORT}
      POSTGRES_HOST: ${USER_POSTGRES_HOST}
      POSTGRES_HOST_PORT: ${USER_POSTGRES_HOST_PORT}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY}
      CORS_ALLOWED_ORIGINS: ${USER_SERVICE_CORS_ALLOWED_ORIGINS}

    depends_on:
      user-postgres:
        condition: service_healthy
      user-redis:
        condition: service_started

    networks:
      - user-service-network

  user-postgres:
    image: postgres:17
    container_name: user-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${USER_POSTGRES_DB}
      POSTGRES_USER: ${USER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${USER_POSTGRES_PASSWORD}

    ports:
      - "${USER_POSTGRES_HOST_PORT}:${USER_POSTGRES_PORT}"

    command: -p ${USER_POSTGRES_PORT}

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${USER_POSTGRES_USER} -p ${USER_POSTGRES_PORT}" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

    volumes:
      - user-postgres-data:/var/lib/postgresql/data

    networks:
      - user-service-network

  user-redis:
    image: redis:8.6.2
    container_name: user-redis
    restart: unless-stopped

    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"

    command: redis-server --port ${REDIS_PORT}

    volumes:
      - redis-data:/data

    networks:
      - user-service-network

  order-service:
    image: order-service:1.0
    build:
      context: ../order-service
      dockerfile: Dockerfile

    container_name: order-service

    restart: unless-stopped

    ports:
      - "${ORDER_SERVICE_PORT}:${ORDER_SERVICE_PORT}"

    environment:
      SPRING_PROFILES_ACTIVE: ${ACTIVE_PROFILE}
      SERVER_PORT: ${ORDER_SERVICE_PORT}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${ORDER_POSTGRES_HOST}:${ORDER_POSTGRES_PORT}/${ORDER_POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${ORDER_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${ORDER_POSTGRES_PASSWORD}
      POSTGRES_DRIVER: ${POSTGRES_DRIVER}
      USER_SERVICE_HOST: ${USER_SERVICE_HOST}
      USER_SERVICE_PORT: ${USER_SERVICE_PORT}
      KAFKA_HOST: ${KAFKA_HOST}
      KAFKA_PORT: ${KAFKA_PORT}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY}
      CORS_ALLOWED_ORIGINS: ${ORDER_SERVICE_CORS_ALLOWED_ORIGINS}

    depends_on:
      order-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

    networks:
      - order-service-network
      - user-service-network
      - kafka-network

  order-postgres:
    image: postgres:17
    container_name: order-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${ORDER_POSTGRES_DB}
      POSTGRES_USER: ${ORDER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ORDER_POSTGRES_PASSWORD}

    ports:
      - "${ORDER_POSTGRES_HOST_PORT}:${ORDER_POSTGRES_PORT}"

    command: -p ${ORDER_POSTGRES_PORT}

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${ORDER_POSTGRES_USER} -p ${ORDER_POSTGRES_PORT}" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    volumes:
      - order-postgres-data:/var/lib/postgresql/data

    networks:
      - order-service-network

  payment-service:
    image: payment-service:1.0
    build:
      context: ../payment-service
      dockerfile: Dockerfile

    container_name: payment-service

    restart: unless-stopped

    ports:
      - "${PAYMENT_SERVICE_PORT}:${PAYMENT_SERVICE_PORT}"

    environment:
      SPRING_PROFILES_ACTIVE: ${ACTIVE_PROFILE}
      SERVER_PORT: ${PAYMENT_SERVICE_PORT}
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
      MONGO_DATABASE: ${MONGO_DATABASE}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      KAFKA_HOST: ${KAFKA_HOST}
      KAFKA_PORT: ${KAFKA_PORT}
      RANDOM_API_URL: ${RANDOM_API_URL}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY}
      CORS_ALLOWED_ORIGINS: ${PAYMENT_SERVICE_CORS_ALLOWED_ORIGINS}

    depends_on:
      payment-mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy

    networks:
      - payment-service-network
      - kafka-network

  payment-mongo:
    image: mongodb/mongodb-community-server:8.3.4-ubi9
    container_name: payment-mongo
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}

    ports:
      - "${MONGO_HOST_PORT}:${MONGO_PORT}"

    command: mongod --port ${MONGO_PORT}

    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --port ${MONGO_PORT} --quiet
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    volumes:
      - mongo-data:/data/db

    networks:
      - payment-service-network

  kafka:
    image: apache/kafka:4.3.1
    container_name: shared-kafka
    restart: unless-stopped

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://shared-kafka:${KAFKA_PORT},EXTERNAL://localhost:${KAFKA_HOST_PORT}
      KAFKA_LISTENERS: CONTROLLER://shared-kafka:${KAFKA_CONTROLLER_PORT},INTERNAL://shared-kafka:${KAFKA_PORT},EXTERNAL://0.0.0.0:${KAFKA_HOST_PORT}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@shared-kafka:${KAFKA_CONTROLLER_PORT}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    ports:
      - "${KAFKA_HOST_PORT}:${KAFKA_HOST_PORT}"

    healthcheck:
      test: [ "CMD-SHELL", "ps aux | grep -v grep | grep kafka || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - kafka-network

volumes:
  auth-postgres-data:
  user-postgres-data:
  order-postgres-data:
  mongo-data:
  redis-data:
  kafka-data:

networks:
  user-service-network:
    driver: bridge
    name: user-service-network
  auth-service-network:
    driver: bridge
    name: auth-service-network
  order-service-network:
    driver: bridge
    name: order-service-network
  payment-service-network:
    driver: bridge
    name: payment-service-network
  kafka-network:
    driver: bridge
    name: kafka-network